  <text x="288" y="192.6" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="800" fill="#3A6A9B" textLength="116" lengthAdjust="spacingAndGlyphs">A real human, anytime</text>
  <g transform="translate(430 189)"><circle r="9" fill="#fff"/><path d="M-4.5 -3.5 h9 a1.5 1.5 0 0 1 1.5 1.5 v4 a1.5 1.5 0 0 1 -1.5 1.5 h-4 l-3 2.6 v-2.6 h-2 a1.5 1.5 0 0 1 -1.5 -1.5 v-4 a1.5 1.5 0 0 1 1.5 -1.5 z" fill="#4F88C6" transform="scale(.9)"/></g>
