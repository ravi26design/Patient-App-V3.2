  </g><text x="99" y="76" text-anchor="middle" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" fill="#E58A5B">Hi</text><path d="M120 58 q6 -6 12 0" fill="none" stroke="#E0B255" stroke-width="3" stroke-linecap="round"/><g transform="translate(6 0)"><g filter="url(#riSh)"><rect x="240" y="98" width="226" height="118" rx="22" fill="url(#riCard)"/></g>
