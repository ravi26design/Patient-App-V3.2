  <path d="M265 138 h5 l2.5 -7 3.5 14 3.5 -9 2 2 h6" fill="none" stroke="#3F6E99" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="308" y="134" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="800" fill="#2E3238" textLength="104" lengthAdjust="spacingAndGlyphs">Here with you</text>
  <text x="308" y="151" font-family="'Avenir Next','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#868C92" textLength="124" lengthAdjust="spacingAndGlyphs">every day · one tap away</text>
